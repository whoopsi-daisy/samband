name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Matches the runtime image, so date-sensitive code is exercised under the
  # same timezone CI-side as it runs in production.
  NODE_VERSION: '24'
  TZ: Europe/Stockholm

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Catches the failure modes that only appear in the image: the native
      # SQLite addon not being traced into the standalone output, and the
      # runtime user not being able to write to the data directory.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: samband:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name samband-ci -p 3000:3000 samband:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -sS http://localhost:3000/api/health
              docker rm -f samband-ci
              exit 0
            fi
            sleep 1
          done
          echo "app did not become healthy" >&2
          docker logs samband-ci
          docker rm -f samband-ci
          exit 1
