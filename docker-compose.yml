# The deployment. Runs the image published to the GitHub Container Registry:
#
#   docker compose up -d
#
# Settings come from the .env file next to this one — copy .env.example.
#
# To build from source instead of pulling (only needed when working on the
# code), add the build override:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  app:
    # SAMBAND_TAG pins the version: `latest` follows the newest release,
    # `edge` follows main, or name a release like `1.2.0` for a deployment
    # that cannot move under you.
    image: ghcr.io/${SAMBAND_REPO:-whoopsi-daisy/samband}:${SAMBAND_TAG:-latest}
    container_name: samband
    restart: unless-stopped
    # Reap zombies and forward SIGTERM so the container stops promptly.
    init: true
    pull_policy: always
    ports:
      - "${SAMBAND_PORT:-3000}:3000"
    environment:
      # The app parses Swedish wall-clock times out of event text and renders
      # them back, so the container clock must be Swedish. Overriding this
      # silently shifts every stored and displayed event time.
      TZ: ${TZ:-Europe/Stockholm}
      # Reverse-proxy hops in front of the app; the client IP for rate limiting
      # is read this many entries from the right of X-Forwarded-For.
      RATE_LIMIT_PROXY_HOPS: ${RATE_LIMIT_PROXY_HOPS:-1}
      # The login for /stats and the import API. Leave both unset and the first
      # start prints an installation key to the log: open /stats/setup, paste
      # it, and choose a username and password there. Setting them here fixes
      # the login at deploy time instead, and takes precedence.
      STATS_USER: ${STATS_USER:-}
      STATS_PASSWORD: ${STATS_PASSWORD:-}
      # ADMIN_SETUP_OPEN=true drops the installation key; STATS_PUBLIC=true
      # drops the login entirely.
      ADMIN_SETUP_OPEN: ${ADMIN_SETUP_OPEN:-}
      STATS_PUBLIC: ${STATS_PUBLIC:-}
      # Optional import on startup:
      #   ndjson      - load BPK_IMPORT_SOURCE once, then keep it current
      #   full        - walk the whole API archive (hours), then keep current
      #   incremental - only pull what is new
      # Unset means no import at all; one can also be started from /stats.
      BPK_IMPORT_ON_START: ${BPK_IMPORT_ON_START:-}
      # The dump for BPK_IMPORT_ON_START=ndjson. A bare name is resolved inside
      # the data directory below, so ./data/brottsplatskartan.ndjson on the
      # host is just `brottsplatskartan.ndjson` here. An http(s) URL also works.
      BPK_IMPORT_SOURCE: ${BPK_IMPORT_SOURCE:-}
      BPK_IMPORT_CONCURRENCY: ${BPK_IMPORT_CONCURRENCY:-4}
    volumes:
      # Bind mount rather than a named volume: the SQLite file and any NDJSON
      # dump stay visible on the host, so importing, backing up and restoring
      # are ordinary file operations. The directory must be writable by uid
      # 1001 (see scripts/import-db.sh, or `chown -R 1001:1001 ./data`).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
