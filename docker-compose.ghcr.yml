# Run the pre-built image from the GitHub Container Registry instead of
# building from source.
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Pin SAMBAND_TAG to a release (e.g. 1.2.0) for reproducible deployments;
# `latest` follows the newest tagged release, `edge` follows main.
services:
  app:
    image: ghcr.io/${SAMBAND_REPO:-whoopsi-daisy/samband}:${SAMBAND_TAG:-latest}
    container_name: samband
    restart: unless-stopped
    init: true
    pull_policy: always
    ports:
      - "${SAMBAND_PORT:-3000}:3000"
    environment:
      # The app parses Swedish wall-clock times out of event text and renders
      # them back, so the container clock must be Swedish.
      TZ: ${TZ:-Europe/Stockholm}
      RATE_LIMIT_PROXY_HOPS: ${RATE_LIMIT_PROXY_HOPS:-1}
      # Set both to require a login on the /stats operational dashboard.
      STATS_USER: ${STATS_USER:-}
      STATS_PASSWORD: ${STATS_PASSWORD:-}
      # Opt-in Brottsplatskartan archive import: 'full' (once, then keeps
      # current), 'incremental', or unset for no import at all.
      BPK_IMPORT_ON_START: ${BPK_IMPORT_ON_START:-}
      BPK_IMPORT_CONCURRENCY: ${BPK_IMPORT_CONCURRENCY:-4}
    volumes:
      # Must be writable by uid 1001 — see scripts/import-db.sh.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
